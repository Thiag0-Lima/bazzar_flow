<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Histórico – Bazzar Flow</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      margin-bottom: 1.25rem;
      align-items: end;
    }
    .filters .form-group { margin-bottom: 0; }
    .filters input {
      padding: .55rem .9rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: .9rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    th, td {
      padding: .85rem 1rem;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
      font-size: .9rem;
    }
    th {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    tr:hover td { background: #f8fafc; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <div class="logo">Bazzar Flow</div>
      <div class="user-info">Olá, <strong id="userName"></strong></div>
    </div>

    <div class="header-clock" id="headerClock">—</div>

    <nav class="nav-links" id="navLinks"></nav>
  </header>

  <main class="page-content">
    <h2 style="margin-bottom:1rem">Histórico de Entregas</h2>

    <div class="filters">
      <div class="form-group">
        <label style="font-size:.8rem">Busca (nº, cliente ou CPF)</label>
        <input type="search" id="searchQ" placeholder="Digite para buscar..." style="min-width:220px" />
      </div>
      <div class="form-group">
        <label style="font-size:.8rem">Data início</label>
        <input type="date" id="dataInicio" />
      </div>
      <div class="form-group">
        <label style="font-size:.8rem">Data fim</label>
        <input type="date" id="dataFim" />
      </div>
      <button class="btn" onclick="loadHistorico()">Filtrar</button>
      <button class="btn btn-outline" onclick="limparFiltros()">Limpar</button>
      <button class="btn btn-outline" onclick="exportExcel()">Exportar Excel</button>
        <button class="btn btn-outline" onclick="exportPDF()">Exportar PDF</button>
    </div>

    <div id="resultado">
      <p class="empty-state">Carregando...</p>
    </div>
  </main>

  <!-- Modal Histórico de Movimentações -->
  <div class="modal-overlay" id="modalLogs">
    <div class="modal" style="max-width:520px">
      <h2 id="logsTitle">Histórico da OS</h2>
      <div id="logsContent" style="max-height:400px;overflow-y:auto;margin:1rem 0">
        Carregando...
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('modalLogs')">Fechar</button>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/historico.js"></script>
  <script src="/js/websocket.js"></script>
</body>
</html>
